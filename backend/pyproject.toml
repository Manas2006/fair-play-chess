[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairplay-review"
version = "0.1.0"
description = "Selective-prediction fair-play review pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "python-chess>=1.999,<2",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
fairplay = "fairplay.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fairplay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
